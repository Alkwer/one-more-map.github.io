name: Bug report
description: Something broken in the solver site or the AHK importer
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostic bundle (for importer problems)
      description: >
        If the AHK importer is involved, right-click its tray icon, choose
        "Save diagnostic bundle...", and drag the zip from your desktop into
        this box. It contains your calibration, an activity log, the last scan
        results, and - only if you answered yes - the last scan screenshots.
        This usually turns three rounds of questions into a one-reply fix.
  - type: input
    id: display
    attributes:
      label: Display setup
      placeholder: e.g. 2560x1440, 125% scaling, HDR on, 2 monitors
