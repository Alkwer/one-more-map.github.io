name: Process border-roll submission

on:
  issues:
    types: [opened, edited, reopened]
  workflow_dispatch:
    inputs:
      issue_number:
        description: Queued issue number to revalidate
        required: true
        type: number

permissions:
  contents: read
  issues: write

concurrency:
  group: border-roll-submission-validation
  cancel-in-progress: false

jobs:
  validate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (!contains(github.event.issue.labels.*.name, 'border-roll:test') &&
      (startsWith(github.event.issue.title, '[data] Border roll') ||
      contains(github.event.issue.labels.*.name, 'border-roll:accepted') ||
      contains(github.event.issue.labels.*.name, 'border-roll:partial') ||
      contains(github.event.issue.labels.*.name, 'border-roll:duplicate') ||
      contains(github.event.issue.labels.*.name, 'border-roll:invalid')))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - id: event
        name: Resolve the latest issue state
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUED_ISSUE_NUMBER: ${{ inputs.issue_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            event_path="$RUNNER_TEMP/reconciled-issue-event.json"
            gh api "repos/$GITHUB_REPOSITORY/issues/$QUEUED_ISSUE_NUMBER" \
              | jq '{issue: .}' > "$event_path"
          else
            event_path="$GITHUB_EVENT_PATH"
          fi
          issue_number="$(jq -r '.issue.number' "$event_path")"
          issue_state="$(jq -r '.issue.state' "$event_path")"
          echo "path=$event_path" >> "$GITHUB_OUTPUT"
          echo "issue_number=$issue_number" >> "$GITHUB_OUTPUT"
          echo "issue_state=$issue_state" >> "$GITHUB_OUTPUT"

      - name: Ensure processing labels exist
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh label create "border-roll:accepted" --color "1F883D" --description "Validated complete Voyage data" --force
          gh label create "border-roll:partial" --color "BF8700" --description "Valid but incomplete Voyage sequence" --force
          gh label create "border-roll:duplicate" --color "8250DF" --description "Already accepted sample IDs" --force
          gh label create "border-roll:invalid" --color "CF222E" --description "Submission failed schema validation" --force
          gh label create "border-roll:test" --color "6E7781" --description "Test submission excluded from research" --force

      - name: Fetch accepted submissions for deduplication
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/accepted-border-roll-issues.json"
          pages="${output}.pages"
          partial="${output}.partial"
          # REST returns at most 100 issues per request. --paginate follows every
          # Link header; --slurp collects the complete corpus for jq to flatten.
          # Any failed page exits this step before the partial file is promoted.
          gh api --method GET --paginate --slurp \
            -f state=all \
            -f per_page=100 \
            -f labels="border-roll:accepted" \
            "repos/$GITHUB_REPOSITORY/issues" \
            > "$pages"
          jq 'flatten | map(select(.pull_request == null) | {number, body, labels}) | sort_by(.number)' \
            "$pages" > "$partial"
          jq -e 'type == "array"' "$partial" >/dev/null
          mv "$partial" "$output"

      - id: validate
        name: Validate and normalize issue JSON
        run: |
          node scripts/process-border-roll-issue.mjs \
            --event "${{ steps.event.outputs.path }}" \
            --accepted "$RUNNER_TEMP/accepted-border-roll-issues.json" \
            --result "$RUNNER_TEMP/border-roll-result.json" \
            --comment "$RUNNER_TEMP/border-roll-comment.md"

      - name: Re-fetch accepted submissions at commit point
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/accepted-border-roll-issues.json"
          pages="${output}.pages"
          partial="${output}.partial"
          gh api --method GET --paginate --slurp \
            -f state=all \
            -f per_page=100 \
            -f labels="border-roll:accepted" \
            "repos/$GITHUB_REPOSITORY/issues" \
            > "$pages"
          jq 'flatten | map(select(.pull_request == null) | {number, body, labels}) | sort_by(.number)' \
            "$pages" > "$partial"
          jq -e 'type == "array"' "$partial" >/dev/null
          mv "$partial" "$output"

      - id: commit
        name: Revalidate duplicate IDs immediately before applying labels
        run: |
          node scripts/process-border-roll-issue.mjs \
            --event "${{ steps.event.outputs.path }}" \
            --accepted "$RUNNER_TEMP/accepted-border-roll-issues.json" \
            --result "$RUNNER_TEMP/border-roll-result.json" \
            --comment "$RUNNER_TEMP/border-roll-comment.md"

      - name: Apply result to issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ steps.event.outputs.issue_number }}
          ISSUE_STATE: ${{ steps.event.outputs.issue_state }}
          RESULT_LABEL: ${{ steps.commit.outputs.label }}
          SHOULD_CLOSE: ${{ steps.commit.outputs.close }}
          CLOSE_REASON: ${{ steps.commit.outputs.reason }}
        run: |
          node scripts/replace-border-roll-labels.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --issue "$ISSUE_NUMBER" \
            --label "$RESULT_LABEL"
          node scripts/upsert-border-roll-comment.mjs "$RUNNER_TEMP/border-roll-comment.md"
          if [ "$SHOULD_CLOSE" = "true" ]; then
            gh issue close "$ISSUE_NUMBER" --reason "$CLOSE_REASON"
          elif [ "$ISSUE_STATE" = "closed" ]; then
            gh issue reopen "$ISSUE_NUMBER"
          fi
          gh issue edit "$ISSUE_NUMBER" --remove-label "border-roll:queued"
