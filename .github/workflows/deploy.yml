name: Quality and GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  issues: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  scope:
    runs-on: ubuntu-slim
    outputs:
      data_only: ${{ steps.changes.outputs.data_only }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: changes
        name: Detect a dataset-only update
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          data_only=false
          if [[ "$EVENT_NAME" != "workflow_dispatch" && -n "$BASE_SHA" && ! "$BASE_SHA" =~ ^0+$ ]]; then
            mapfile -t changed_files < <(git diff --name-only "$BASE_SHA" "$HEAD_SHA")
            if (( ${#changed_files[@]} == 1 )) && [[ "${changed_files[0]}" == "data/border-rolls-v2.json" ]]; then
              data_only=true
            fi
          fi
          echo "data_only=$data_only" >> "$GITHUB_OUTPUT"
          echo "Dataset-only update: $data_only" >> "$GITHUB_STEP_SUMMARY"

  windows-playwright-exit:
    needs: scope
    if: needs.scope.outputs.data_only != 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify Playwright tears down its Windows preview process
        run: npm run test:e2e:exit

  quality:
    needs: scope
    runs-on: ubuntu-latest
    env:
      PLAYWRIGHT_PROJECT_SITE_PREFIX: /one-more-map.github.io/
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Verify private vulnerability reporting remains enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          reporting_enabled="$(gh api "repos/$GITHUB_REPOSITORY/private-vulnerability-reporting" --jq '.enabled')"
          test "$reporting_enabled" = "true"
      - name: Enforce npm audit policy
        if: needs.scope.outputs.data_only != 'true'
        run: npm run audit:ci
      - name: Validate dataset update
        if: needs.scope.outputs.data_only == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BORDER_ROLL_ACCEPTED_PATH: ${{ runner.temp }}/accepted-border-roll-issues.json
        run: |
          node scripts/fetch-accepted-border-roll-issues.mjs \
            --repo "$GITHUB_REPOSITORY" \
            --output "$BORDER_ROLL_ACCEPTED_PATH"
          npm run validate:data-update
      - name: Run full validation
        if: needs.scope.outputs.data_only != 'true'
        run: npm run validate
      - name: Enforce solver performance budget
        if: needs.scope.outputs.data_only != 'true'
        run: npm run test:performance
      - name: Install Playwright browsers
        if: needs.scope.outputs.data_only != 'true'
        run: npx playwright install --with-deps chromium webkit
      - name: Stage root-site artifact and project-site E2E wrapper
        if: needs.scope.outputs.data_only != 'true' || (github.event_name != 'pull_request' && github.ref == 'refs/heads/main')
        run: npm run stage:pages
      - name: Run bounded browser matrix
        if: needs.scope.outputs.data_only != 'true'
        run: npx playwright test
      - uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        if: ${{ needs.scope.outputs.data_only != 'true' && !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          path: staging

  deploy:
    if: >-
      ${{
        always() &&
        github.event_name != 'pull_request' &&
        github.ref == 'refs/heads/main' &&
        needs.scope.result == 'success' &&
        needs.quality.result == 'success' &&
        (needs.windows-playwright-exit.result == 'success' || needs.windows-playwright-exit.result == 'skipped')
      }}
    needs: [scope, quality, windows-playwright-exit]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
