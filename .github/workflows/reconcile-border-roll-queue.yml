name: Reconcile border-roll validation queue

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

permissions:
  actions: write
  issues: read

concurrency:
  group: border-roll-queue-reconciliation
  cancel-in-progress: false

jobs:
  dispatch:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
      - name: Dispatch every durable queue entry
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-border-roll-queue.mjs --repo "$GITHUB_REPOSITORY"
