name: Build border-roll dataset

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: read
  pull-requests: write

concurrency:
  group: border-roll-dataset
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24

      - name: Fetch accepted submissions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          output="$RUNNER_TEMP/accepted-border-roll-issues.json"
          if gh label list --limit 1000 --json name --jq '.[].name' | grep -Fxq "border-roll:accepted"; then
            node scripts/fetch-accepted-border-roll-issues.mjs \
              --repo "$GITHUB_REPOSITORY" \
              --output "$output"
          else
            echo "[]" > "$output"
          fi

      - name: Build canonical dataset
        run: |
          node --test scripts/border-roll-data.node-test.mjs
          node scripts/build-border-roll-dataset.mjs \
            --input "$RUNNER_TEMP/accepted-border-roll-issues.json" \
            --output data/border-rolls-v2.json

      - name: Reconcile dataset update pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/reconcile-border-roll-dataset-pr.mjs
