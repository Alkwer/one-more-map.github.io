name: Production anti-framing header gate

on:
  workflow_call:
    inputs:
      production_url:
        description: Immutable preview or production URL to verify
        required: true
        type: string
  workflow_dispatch:
    inputs:
      production_url:
        description: Immutable preview or production URL to verify
        required: true
        type: string

permissions:
  contents: read

jobs:
  verify-production-headers:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Require browser-enforced anti-framing headers
        env:
          PRODUCTION_URL: ${{ inputs.production_url }}
        run: npm run check:production-headers -- "$PRODUCTION_URL"
